summary: Decentralized internet radio player on Nostr — 40,000+ live stations
description: >-
  WaveFunc Radio is a decentralized internet radio directory and player built on
  Nostr. Browse and search 40,000+ live radio stations across genres, languages,
  and countries, stream with live ICY track metadata and a 16-band audio
  spectrogram, keep listening in the background with lock-screen and Bluetooth
  controls, and sync your favorites, saved tracks, curated lists, reactions, and
  comments over Nostr relays.
license: MIT
