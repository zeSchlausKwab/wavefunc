[package]
name = "wavefunc_bridge"
version = "0.2.2"
edition = "2021"
description = "flutter_rust_bridge FFI layer exposing wavefunc-core to Flutter"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
once_cell = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
wavefunc-core = { path = "../../crates/wavefunc-core" }
