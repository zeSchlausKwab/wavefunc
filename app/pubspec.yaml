name: wavefunc_app
description: "WaveFunc Radio — Native decentralized internet radio client on Nostr."
publish_to: 'none'
version: 0.2.1+2001

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  cached_network_image: ^3.4.1
  flutter_rust_bridge: ^2.11.1
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  just_audio: ^0.10.5
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  tray_manager: ^0.5.2
  url_launcher: ^6.3.1
  uuid: ^4.6.0
  video_player: ^2.9.5
  window_manager: ^0.5.1
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
