name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
        env:
          RELAY_URL: wss://relay.wavefunc.live
      - run: bunx --no-install playwright-core install --with-deps --only-shell chromium
      - name: Open the production build in Chromium
        run: |
          PORT=3100 NODE_ENV=production bun src/index.tsx &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --output /dev/null --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:3100/apps
          bun run test:production-web http://127.0.0.1:3100

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path crates/wavefunc-core/Cargo.toml
      - run: cargo check --manifest-path app/rust/Cargo.toml

  flutter-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - working-directory: tui
        run: go vet ./... && go test -race ./...
