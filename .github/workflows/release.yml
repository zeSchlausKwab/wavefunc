name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  RELAY_URL: wss://relay.wavefunc.live

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${GITHUB_REF#refs/tags/}" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Generating changelog from $PREV_TAG to ${GITHUB_REF#refs/tags/}..."
          CHANGES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges)
          # Write to file for the release body
          cat > RELEASE_NOTES.md << 'HEREDOC'
          ## What's Changed
          HEREDOC
          echo "$CHANGES" >> RELEASE_NOTES.md

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WaveFunc ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: false

  build-desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            label: macOS
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: bun install

      - name: Prepare desktop media engine (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin /tmp/wavefunc-deno-arm /tmp/wavefunc-deno-x64
          curl --fail --location --retry 3 \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos \
            --output src-tauri/resources/bin/yt-dlp
          curl --fail --location --retry 3 \
            https://github.com/denoland/deno/releases/download/v2.8.1/deno-aarch64-apple-darwin.zip \
            --output /tmp/deno-arm.zip
          curl --fail --location --retry 3 \
            https://github.com/denoland/deno/releases/download/v2.8.1/deno-x86_64-apple-darwin.zip \
            --output /tmp/deno-x64.zip
          unzip -q /tmp/deno-arm.zip -d /tmp/wavefunc-deno-arm
          unzip -q /tmp/deno-x64.zip -d /tmp/wavefunc-deno-x64
          mv /tmp/wavefunc-deno-arm/deno src-tauri/resources/bin/deno-aarch64
          mv /tmp/wavefunc-deno-x64/deno src-tauri/resources/bin/deno-x86_64
          chmod +x src-tauri/resources/bin/yt-dlp \
            src-tauri/resources/bin/deno-aarch64 \
            src-tauri/resources/bin/deno-x86_64

      - name: Prepare desktop media engine (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin /tmp/wavefunc-deno
          curl --fail --location --retry 3 \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux \
            --output src-tauri/resources/bin/yt-dlp
          curl --fail --location --retry 3 \
            https://github.com/denoland/deno/releases/download/v2.8.1/deno-x86_64-unknown-linux-gnu.zip \
            --output /tmp/deno.zip
          unzip -q /tmp/deno.zip -d /tmp/wavefunc-deno
          mv /tmp/wavefunc-deno/deno src-tauri/resources/bin/deno
          chmod +x src-tauri/resources/bin/yt-dlp src-tauri/resources/bin/deno

      - name: Prepare desktop media engine (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources/bin | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile src-tauri/resources/bin/yt-dlp.exe
          Invoke-WebRequest https://github.com/denoland/deno/releases/download/v2.8.1/deno-x86_64-pc-windows-msvc.zip -OutFile $env:RUNNER_TEMP/deno.zip
          Expand-Archive -Force $env:RUNNER_TEMP/deno.zip $env:RUNNER_TEMP/wavefunc-deno
          Move-Item $env:RUNNER_TEMP/wavefunc-deno/deno.exe src-tauri/resources/bin/deno.exe

      - name: Build frontend
        run: bun run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: WaveFunc ${{ needs.create-release.outputs.version }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: ''
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Initialize Tauri Android project
        run: bunx tauri android init

      - name: Generate app icons
        run: bunx tauri icon src-tauri/icons/icon.png

      - name: Setup keystore and signing
        run: |
          mkdir -p src-tauri/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src-tauri/keystore/wavefunc.keystore
          printf 'password=%s\nkeyAlias=wavefunc\nstoreFile=../../../keystore/wavefunc.keystore\n' \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            > src-tauri/gen/android/keystore.properties
          cp src-tauri/android-template/build.gradle.kts src-tauri/gen/android/app/build.gradle.kts
          cp src-tauri/android-template/root-build.gradle.kts src-tauri/gen/android/build.gradle.kts

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: bunx tauri android build --apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  publish-release:
    needs: [create-release, build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
