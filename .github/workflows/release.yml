name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${GITHUB_REF#refs/tags/}" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          CHANGES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges)
          cat > RELEASE_NOTES.md << 'HEREDOC'
          ## What's Changed
          HEREDOC
          echo "$CHANGES" >> RELEASE_NOTES.md

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WaveFunc ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: false

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Rust core (macOS arm64)
        run: ./app/scripts/build-rust-desktop.sh release
      - name: Analyze, test & build macOS app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build macos --release
      - name: Package macOS release
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          cd app/build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent wavefunc_app.app "WaveFunc-${VERSION}-macos-arm64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: app/build/macos/Build/Products/Release/WaveFunc-*-macos-arm64.zip

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Flutter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libssl-dev \
            libayatana-appindicator3-dev libsecret-1-dev libjsoncpp-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Rust core (Linux x64)
        run: ./app/scripts/build-rust-desktop.sh release
      - name: Build Linux release
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release
      - name: Package Linux release
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          tar -czf "WaveFunc-${VERSION}-linux-x64.tar.gz" -C app/build/linux/x64/release bundle
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: WaveFunc-*-linux-x64.tar.gz

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Rust core (Windows x64)
        shell: pwsh
        run: |
          cargo build --manifest-path app/rust/Cargo.toml --release
          New-Item -ItemType Directory -Force app/windows/lib | Out-Null
          Copy-Item app/rust/target/release/wavefunc_bridge.dll app/windows/lib/wavefunc_bridge.dll
      - name: Build Windows release
        working-directory: app
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
      - name: Package Windows release
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath "WaveFunc-$version-windows-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: WaveFunc-*-windows-x64.zip

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk & Android NDK
        run: |
          sdkmanager "ndk;28.2.13676358"
          cargo install cargo-ndk --locked
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Rust core (Android ABIs)
        working-directory: app/rust
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../android/app/src/main/jniLibs \
            build --release
      - name: Setup Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/wavefunc.keystore
            printf 'password=%s\nkeyAlias=wavefunc\nstoreFile=wavefunc.keystore\n' \
              "$ANDROID_KEYSTORE_PASSWORD" \
              > app/android/keystore.properties
          fi
      - name: Build Android release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - name: Rename release APK
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          cp app/build/app/outputs/flutter-apk/app-release.apk "WaveFunc-${VERSION}-android-universal.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: WaveFunc-*-android-universal.apk

  publish-release:
    needs: [create-release, build-macos, build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
