name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${GITHUB_REF#refs/tags/}" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          CHANGES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges)
          cat > RELEASE_NOTES.md << 'HEREDOC'
          ## What's Changed
          HEREDOC
          echo "$CHANGES" >> RELEASE_NOTES.md

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WaveFunc ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: false

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Rust core (macOS arm64)
        run: ./app/scripts/build-rust-desktop.sh release
      - name: Analyze, test & build macOS app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build macos --release
      - name: Package macOS release
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          cd app/build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent wavefunc_app.app "WaveFunc-${VERSION}-macos-arm64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: app/build/macos/Build/Products/Release/WaveFunc-*-macos-arm64.zip

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Flutter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libssl-dev \
            libayatana-appindicator3-dev libsecret-1-dev libjsoncpp-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Rust core (Linux x64)
        run: ./app/scripts/build-rust-desktop.sh release
      - name: Build Linux release
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release
      - name: Package Linux release
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          tar -czf "WaveFunc-${VERSION}-linux-x64.tar.gz" -C app/build/linux/x64/release bundle
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: WaveFunc-*-linux-x64.tar.gz

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Rust core (Windows x64)
        shell: pwsh
        run: |
          cargo build --manifest-path app/rust/Cargo.toml --release
          New-Item -ItemType Directory -Force app/windows/lib | Out-Null
          Copy-Item app/rust/target/release/wavefunc_bridge.dll app/windows/lib/wavefunc_bridge.dll
      - name: Build Windows release
        working-directory: app
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
      - name: Package Windows release
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath "WaveFunc-$version-windows-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: WaveFunc-*-windows-x64.zip

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Android media format selection
        env:
          PYTHONPATH: app/android/app/src/main/python
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s app/android/tests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk & Android NDK
        run: |
          sdkmanager "ndk;28.2.13676358"
          cargo install cargo-ndk --locked
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Rust core (Android ABIs)
        working-directory: app/rust
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../android/app/src/main/jniLibs \
            build --release
      - name: Setup Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/wavefunc.keystore
            printf 'password=%s\nkeyAlias=wavefunc\nstoreFile=wavefunc.keystore\n' \
              "$ANDROID_KEYSTORE_PASSWORD" \
              > app/android/keystore.properties
          fi
      - name: Build Android release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - name: Verify audio_service & notification drawables survived R8 shrinking
        run: |
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -n1)"
          RESOURCES="$("$AAPT2" dump resources app/build/app/outputs/flutter-apk/app-release.apk)"
          for res in drawable/ic_stat_wavefunc drawable/audio_service_play_arrow drawable/audio_service_pause drawable/audio_service_stop; do
            if ! grep -q "$res" <<<"$RESOURCES"; then
              echo "ERROR: Missing R8-shrunk resource $res in app-release.apk" >&2
              exit 1
            fi
          done
      - name: Rename release APK
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          cp app/build/app/outputs/flutter-apk/app-release.apk "WaveFunc-${VERSION}-android-universal.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: WaveFunc-*-android-universal.apk

  build-tui:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      - name: Test TUI
        working-directory: tui
        run: go vet ./... && go test -race ./...

      - name: Cross-compile wf binaries
        working-directory: tui
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT::8}"

          build_tar() {
            local goos="$1" goarch="$2"
            local stage="dist/stage_${goos}_${goarch}"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="$LDFLAGS" -o "${stage}/wf" ./cmd/wf
            tar -czf "dist/wf_${VERSION}_${goos}_${goarch}.tar.gz" -C "$stage" wf
            rm -rf "$stage"
          }

          build_tar darwin arm64
          build_tar darwin amd64
          build_tar linux amd64
          build_tar linux arm64

          mkdir -p dist/stage_windows_amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/stage_windows_amd64/wf.exe ./cmd/wf
          (cd dist/stage_windows_amd64 && zip -q "../wf_${VERSION}_windows_amd64.zip" wf.exe)
          rm -rf dist/stage_windows_amd64

          (cd dist && sha256sum wf_${VERSION}_* > wf_checksums.txt)

      - name: Upload TUI artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            tui/dist/wf_*.tar.gz
            tui/dist/wf_*.zip
            tui/dist/wf_checksums.txt

      - name: Share TUI checksums for Homebrew tap
        uses: actions/upload-artifact@v4
        with:
          name: wf-checksums
          path: tui/dist/wf_checksums.txt
          retention-days: 1

  publish-release:
    needs: [create-release, build-macos, build-linux, build-windows, build-android, build-tui]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });

  update-homebrew:
    needs: [create-release, build-tui, publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download TUI checksums
        uses: actions/download-artifact@v4
        with:
          name: wf-checksums
          path: checksums

      - name: Update zeSchlausKwab/homebrew-tap Formula/wf.rb
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: zeSchlausKwab/homebrew-tap
          VERSION: ${{ needs.create-release.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN secret not configured; skipping Homebrew tap update."
            exit 0
          fi

          sha_for() {
            awk -v f="$1" '$2 == f { print $1; exit }' checksums/wf_checksums.txt
          }

          SHA_DARWIN_ARM64="$(sha_for "wf_${VERSION}_darwin_arm64.tar.gz")"
          SHA_DARWIN_AMD64="$(sha_for "wf_${VERSION}_darwin_amd64.tar.gz")"
          SHA_LINUX_ARM64="$(sha_for "wf_${VERSION}_linux_arm64.tar.gz")"
          SHA_LINUX_AMD64="$(sha_for "wf_${VERSION}_linux_amd64.tar.gz")"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula

          cat > tap/Formula/wf.rb << EOF
          class Wf < Formula
            desc "WaveFunc Radio terminal UI — decentralized internet radio on Nostr"
            homepage "https://wavefunc.live"
            version "${VERSION}"
            license "MIT"

            depends_on "mpv"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/zeSchlausKwab/wavefunc/releases/download/${TAG}/wf_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "https://github.com/zeSchlausKwab/wavefunc/releases/download/${TAG}/wf_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/zeSchlausKwab/wavefunc/releases/download/${TAG}/wf_${VERSION}_linux_arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "https://github.com/zeSchlausKwab/wavefunc/releases/download/${TAG}/wf_${VERSION}_linux_amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              bin.install "wf"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/wf --version")
            end
          end
          EOF

          cd tap
          git config user.name "wavefunc-release-bot"
          git config user.email "release-bot@wavefunc.live"
          git add Formula/wf.rb
          if ! git diff --cached --quiet; then
            git commit -m "wf ${VERSION}"
            git push origin HEAD
          fi
